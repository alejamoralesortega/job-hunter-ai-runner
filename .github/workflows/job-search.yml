name: Job Search

on:
  schedule:
    # El schedule de GitHub no es confiable (confirmado en vivo: huecos de hasta 11+ horas, y un
    # cron de prueba cada minuto no disparó ni una vez en 6+ min -- falla de la plataforma). Se
    # deja como intento de más, pero el respaldo real es /api/cron/dispatch del dashboard,
    # llamado por un pinger externo cada 20-30 min vía workflow_dispatch.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar corrida completa aunque haya corrido hace menos de 4h"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Repo público -> Actions es ilimitado/gratis. 45 min completos para este único usuario, sin
    # repartir con nadie más.
    timeout-minutes: 45
    steps:
      - name: Verificar si ya hubo una corrida exitosa en las últimas 4h
        # Se salta SOLO si vino con force=true (un humano le dio "Run workflow" y marcó la
        # casilla, o una corrida de prueba explícita) -- tanto el schedule como el
        # workflow_dispatch normal (el que llama /api/cron/dispatch cada 20-30 min) respetan
        # este chequeo, así llamarlo seguido nunca duplica una corrida real.
        if: github.event.inputs.force != 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # OJO: un ciclo que el propio gate saltó también termina en conclusion "success" --
          # ningún paso falló, solo se saltaron. Filtrar solo por status=success sin más se
          # toma a sí mismo como referencia cada vez (queda en 0h para siempre, nunca vuelve a
          # correr de verdad -- pasó en producción). Se filtra por duración: un gate-skip tarda
          # 1-2s, un ciclo real tarda varios minutos -- solo cuenta como "corrida real" una que
          # haya durado más de 60s.
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/job-search.yml/runs?status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select((.updated_at | fromdateiso8601) - (.run_started_at | fromdateiso8601) > 60)][0].created_at // empty')
          if [ -z "$last" ]; then
            echo "sin corridas reales previas en las últimas 30 -- corre."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          elapsed_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "última corrida REAL exitosa hace ${elapsed_h}h"
          if [ "$elapsed_h" -ge 4 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: github.event.inputs.force == 'true' || steps.gate.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: github.event.inputs.force == 'true' || steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: github.event.inputs.force == 'true' || steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Instalar Chromium (para las fuentes que necesitan navegador)
        if: github.event.inputs.force == 'true' || steps.gate.outputs.should_run == 'true'
        run: playwright install --with-deps chromium

      - name: Ejecutar búsqueda y postulación asistida
        if: github.event.inputs.force == 'true' || steps.gate.outputs.should_run == 'true'
        env:
          # No es secreto -- es la URL pública del dashboard, no un dato sensible.
          DASHBOARD_API_BASE: https://job-hunter-ai-theta.vercel.app
          DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
