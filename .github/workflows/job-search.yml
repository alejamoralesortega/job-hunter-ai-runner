name: Job Search

on:
  schedule:
    # Dispara CADA HORA (en :17, no en punto -- evita la congestión del inicio de la hora) en vez
    # de cada 4h -- el disparo real sigue siendo cada ~4h (lo decide el paso "gate" de abajo), pero
    # tener 4 oportunidades de más por ciclo es lo que permite auto-recuperarse cuando GitHub se
    # salta o cancela un tick.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Repo público -> Actions es ilimitado/gratis. 45 min completos para este único usuario, sin
    # repartir con nadie más.
    timeout-minutes: 45
    steps:
      - name: Verificar si ya hubo una corrida exitosa en las últimas 4h
        if: github.event_name == 'schedule'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/job-search.yml/runs?status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].created_at // empty')
          if [ -z "$last" ]; then
            echo "sin corridas exitosas previas -- corre."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          elapsed_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "última corrida exitosa hace ${elapsed_h}h"
          if [ "$elapsed_h" -ge 4 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Instalar Chromium (para las fuentes que necesitan navegador)
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: playwright install --with-deps chromium

      - name: Ejecutar búsqueda y postulación asistida
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        env:
          # No es secreto -- es la URL pública del dashboard, no un dato sensible.
          DASHBOARD_API_BASE: https://job-hunter-ai-theta.vercel.app
          DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
