name: Job Search

on:
  schedule:
    # Cada 4 horas: 1,5,9,13,17,21 UTC = 20:00,00:00,04:00,08:00,12:00,16:00 hora Colombia (UTC-5)
    - cron: "0 1,5,9,13,17,21 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    # Repo público -> Actions es ilimitado/gratis. 45 min completos para este único usuario, sin
    # repartir con nadie más.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium (para las fuentes que necesitan navegador)
        run: playwright install --with-deps chromium

      - name: Ejecutar búsqueda y postulación asistida
        env:
          # No es secreto -- es la URL pública del dashboard, no un dato sensible.
          DASHBOARD_API_BASE: https://job-hunter-ai-theta.vercel.app
          DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
